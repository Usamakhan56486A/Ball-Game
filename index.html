<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=yes, viewport-fit=cover">
    <title>Ball Game</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <!-- Ad layer. Must be in the page before Unity boots, because the jslib
         entry points call straight into the BallAds object it defines. -->
    <script src="TemplateData/BallAds.js"></script>
  </head>
  <body>
    <!--
      Fill the entire browser viewport. The stock Unity desktop template sizes
      this container to a fixed WIDTH x HEIGHT in pixels and centres it, which is
      what made the game appear as a small window inside the page instead of
      full screen. Everything below sizes off the viewport instead.
    -->
    <div id="unity-container">
      <div id="unity-fullscreen-container">
        <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
        <div id="unity-loading-container">
          <div id="unity-loading-bar">
            <div id="unity-title">Ball Game</div>
            <div id="unity-progress-bar-empty">
              <div id="unity-progress-bar-full"></div>
            </div>
            <div id="unity-progress-note">Loading&hellip;</div>
          </div>
        </div>
        <div id="unity-warning"></div>
      </div>
      <div id="unity-footer">
        <div id="unity-fullscreen-button" title="Toggle full screen"></div>
        <div id="unity-build-title">Ball Game</div>
      </div>
    </div>

    <!--
      Ad slots. These stay display:none until the browser half decides an ad
      actually belongs there, which only happens when AdsConfig has real ids in
      it and the page is a real WebGL build. Nothing in this block loads
      Google's script by itself - BallAds.jslib does that, so an unconfigured
      build never touches the ad network at all.

      The slots sit above the canvas rather than squeezing it, because resizing
      the canvas when a unit resolves would reflow the whole game underfoot.
    -->
    <div id="bg-ad-top" class="ad-slot"></div>
    <div id="bg-ad-bottom" class="ad-slot"></div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var container = document.querySelector("#unity-container");
      var fullscreenContainer = document.querySelector("#unity-fullscreen-container");

      // Keep the canvas backing store matched to the CSS size it actually
      // occupies. Without this the canvas keeps its build-time pixel size and
      // the picture is letterboxed inside a full-screen page.
      function resizeCanvas() {
        var w = container.clientWidth;
        var h = container.clientHeight;
        if (!w || !h) return;
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.style.width = w + "px";
        canvas.style.height = h + "px";
        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
      }
      window.addEventListener("resize", resizeCanvas);
      window.addEventListener("orientationchange", resizeCanvas);

      // Shows a temporary message banner for a few seconds, or a permanent error
      // message on top of the canvas if type == 'error'.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function () {
            div.remove();
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/webgl.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/webgl.data.unityweb",
        frameworkUrl: buildUrl + "/webgl.framework.js.unityweb",
        codeUrl: buildUrl + "/webgl.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",

        // Explicit root for full screen so the canvas (not the footer) is what
        // the browser promotes when the user presses F11 or the button.
        fullscreenElementID: "unity-fullscreen-container",

        companyName: "Khang",
        productName: "Ball Game",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
      };

      // Cap the device pixel ratio. Letting Unity pick means a 3x phone screen
      // tries to render 9x the pixels, which is the single most common cause of
      // a WebGL build that feels slow to start and stutters once running.
      config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);

      resizeCanvas();

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        var loadingContainer = document.querySelector("#unity-loading-container");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");
        var progressNote = document.querySelector("#unity-progress-note");

        createUnityInstance(canvas, config, function (progress) {
          if (progress < 1) {
            loadingContainer.style.display = "block";
            progressBarFull.style.width = (100 * progress) + "%";
            // Report MB rather than a bare percentage: it makes a long download
            // legible instead of looking stalled.
            progressNote.textContent = "Loading " + Math.round(progress * 100) + "%";
          } else {
            loadingContainer.style.display = "none";
          }
        }).then(function (unityInstance) {
          document.querySelector("#unity-fullscreen-button").onclick = function () {
            unityInstance.SetFullscreen(1);
          };
        }).catch(function (message) {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
